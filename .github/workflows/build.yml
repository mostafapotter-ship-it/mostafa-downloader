name: Build and Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Unzip project
        run: unzip -q MostafaDownloader.zip
      - name: Build release APK
        working-directory: MostafaDownloader
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: mostafadl2026
          KEY_ALIAS: mostafa
          KEY_PASSWORD: mostafadl2026
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp MostafaDownloader/app/build/outputs/apk/release/app-release.apk MostafaDownloader.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MostafaDownloader v1.0.${{ github.run_number }}
          body: "Update ${{ github.run_number }}"
          files: MostafaDownloader.apk
